min_version = "2025.11.0"

[tools]
node = "26.1.0"
pnpm = "10.32.1"
python = "3.12.14"
uv = "0.12.5"

[env]
# uv uses the same interpreter as mise.
UV_PYTHON = "3.12.14"

[tasks.setup]
description = "Install locked JavaScript and Python dependencies"
run = [
  "pnpm install --frozen-lockfile",
  "pnpm exec playwright install chromium",
  "uv sync --locked --project training",
]

[tasks.dev]
description = "Start the cron browser demo"
run = "pnpm run dev"

[tasks.check]
description = "Run cron and real WebGPU browser checks"
run = "pnpm run check"

[tasks.build]
description = "Build the library and static demo"
run = ["pnpm run build", "pnpm run build:demo"]

[tasks."train:cron"]
run = "pnpm run train"

[tasks."check:python"]
description = "Lint, format, and type-check Python; run any Python tests"
dir = "training"
run = [
  "uv run --locked ruff check .",
  "uv run --locked ruff format --check .",
  "uv run --locked ty check",
  # Pytest exits 5 when no Python tests exist; other failures must still fail.
  'uv run --locked pytest || test "$?" -eq 5',
]
