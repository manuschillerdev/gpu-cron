min_version = "2025.11.0"

[tools]
node = "26.1.0"
pnpm = "10.32.1"
python = "3.12.14"
uv = "0.12.5"

[env]
# uv uses the same interpreter as mise.
UV_PYTHON = "3.12.14"

[tasks.setup]
description = "Install locked JavaScript and Python dependencies"
run = [
  "pnpm install --frozen-lockfile",
  "pnpm exec playwright install chromium",
  "uv sync --locked --project training",
]

[tasks.dev]
description = "Start the cron browser demo"
run = "pnpm run dev"

[tasks.check]
description = "Run cron and real WebGPU browser checks"
run = "pnpm run check"

[tasks.build]
description = "Build the library and static demo"
run = ["pnpm run build", "pnpm run build:demo"]

[tasks."train:cron"]
run = "pnpm run train"

[tasks."benchmark:training"]
run = "pnpm run benchmark:training"
