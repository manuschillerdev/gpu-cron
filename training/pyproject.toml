[project]
name = "gpu-cron-training"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlx>=0.31,<0.33",
    "numpy>=1.26,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
